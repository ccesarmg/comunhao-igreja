<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comunhão Igreja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: menu lateral por perfil (vira faixa rolável no celular) + área de trabalho em cartões. Vinho litúrgico sobre cinza esverdeado frio. */
:root{
  --bg:#EFF1F0; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#1C2427; --muted:#5A676C; --line:#D8DEDC;
  --accent:#6B2737; --on-accent:#FFFFFF; --accent-soft:#F1E2E5;
  --teal:#2F6F7A; --teal-soft:#DAEAEC; --gold:#A87A1E;
  --ok:#2A7855; --ok-soft:#DEF0E7; --warn:#9C620E; --warn-soft:#F6E9D0; --bad:#AE3822; --bad-soft:#F5DED8;
  --display:'Newsreader',Georgia,'Times New Roman',serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121719; --surface:#1B2225; --surface-2:#222A2D; --ink:#E6EBEA; --muted:#9BA8AC; --line:#2F393C;
    --accent:#E3A0AE; --on-accent:#2A0E15; --accent-soft:#3B2229;
    --teal:#72B6C2; --teal-soft:#1F3a40; --gold:#DDB056;
    --ok:#62C197; --ok-soft:#1B3328; --warn:#E3AB52; --warn-soft:#3A2D14; --bad:#EC8A74; --bad-soft:#40211A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121719; --surface:#1B2225; --surface-2:#222A2D; --ink:#E6EBEA; --muted:#9BA8AC; --line:#2F393C;
  --accent:#E3A0AE; --on-accent:#2A0E15; --accent-soft:#3B2229;
  --teal:#72B6C2; --teal-soft:#1F3a40; --gold:#DDB056;
  --ok:#62C197; --ok-soft:#1B3328; --warn:#E3AB52; --warn-soft:#3A2D14; --bad:#EC8A74; --bad-soft:#40211A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:30px;line-height:1.15}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.app,.login{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;align-items:start}
.side{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:600}
.brand strong{font-family:var(--display);font-size:19px;display:block;line-height:1.1}
.brand span{font-size:11.5px;color:var(--muted)}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--surface-2)}
.me b{display:block;font-size:13px;line-height:1.25}
.me span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 11px;border-radius:8px;font-weight:500;color:var(--muted)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible,.btn:focus-visible,.chipbtn:focus-visible,.row.click:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side-foot{display:flex;flex-direction:column;gap:6px}
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card h3{margin-bottom:12px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{margin:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.kpi b{display:block;font-family:var(--display);font-size:28px;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{font-size:12px;color:var(--muted)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.block{width:100%}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar select{min-width:0;flex:1 1 180px;max-width:320px}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row.click{cursor:pointer;border-radius:8px}
.row.click:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow-wrap:anywhere}
.row .grow span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ava{display:inline-grid;place-items:center;flex:none;border-radius:50%;object-fit:cover;background:var(--accent-soft);color:var(--accent);font-weight:700}
.datebox{flex:none;width:46px;text-align:center;border-radius:9px;background:var(--surface-2);padding:5px 0;line-height:1.1}
.datebox b{display:block;font-family:var(--display);font-size:20px}
.datebox span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:14px 4px 4px}
.amount{font-variant-numeric:tabular-nums;font-weight:700}
.amount.in{color:var(--ok)}
.amount.out{color:var(--bad)}
.hb{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr) 34px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hb i{display:block;height:10px;border-radius:5px;background:var(--teal)}
.hb .track{background:var(--surface-2);border-radius:5px}
.hb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:flex;gap:8px;align-items:flex-end}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);text-align:center}
.col .bars{height:130px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--line)}
.col .bars i{display:block;width:100%;max-width:26px;border-radius:4px 4px 0 0;background:var(--teal);min-height:2px}
.col .bars i.b2{background:var(--accent)}
.col b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--teal);margin-right:6px}
.legend span.l2::before{background:var(--accent)}
.hero{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px}
.hero h2{font-size:26px}
.hero p{opacity:.9}
.hero .btn{background:var(--on-accent);color:var(--accent);border-color:transparent;align-self:flex-start}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.f.wide{grid-column:1/-1}
.photo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(10,14,15,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:20;padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:16px;border:1px solid var(--line);width:100%;max-width:560px;padding:22px;display:flex;flex-direction:column;gap:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.qrbox{background:#fff;padding:14px;border-radius:12px;display:inline-block;border:1px solid var(--line);line-height:0}
.qrwrap{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.code{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:22px;font-weight:700;letter-spacing:.08em}
.vf{position:relative;height:210px;border-radius:12px;background:#0f1517;overflow:hidden;display:grid;place-items:center}
.vf::before{content:"";width:130px;height:130px;border:2px dashed rgba(255,255,255,.55);border-radius:10px}
.vf .ln{position:absolute;left:25%;right:25%;top:50%;height:2px;background:#E3A0AE;box-shadow:0 0 10px #E3A0AE}
@media (prefers-reduced-motion:no-preference){.vf .ln{animation:scan 2.2s ease-in-out infinite alternate}}
@keyframes scan{from{top:30%}to{top:70%}}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline input{flex:1 1 160px}
.login{max-width:980px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:stretch;min-height:100vh;align-content:center}
.login-brand{background:var(--accent);color:var(--on-accent);border-radius:18px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.login-brand h1{font-size:40px}
.login-brand p{opacity:.9;max-width:34ch}
.login-brand ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px;opacity:.92}
.login-box{display:flex;flex-direction:column;gap:14px;justify-content:center}
.roles{display:grid;gap:10px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.role>div{flex:1 1 180px;min-width:0}
.role strong{display:block}
.role span{font-size:12.5px;color:var(--muted)}
.role select{flex:1 1 150px;max-width:220px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td b{display:block}
.tbl td span.sub{display:block;font-size:12.5px;color:var(--muted)}
.tbl .ta-r{text-align:right;white-space:nowrap}
.fset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;min-width:0}
.fset legend{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 6px}
.checks{display:grid;gap:4px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));max-height:240px;overflow-y:auto}
.chk{display:flex;align-items:center;gap:8px;padding:5px 2px;min-width:0;cursor:pointer}
.chk input{width:auto;flex:none}
.chk span{min-width:0;overflow-wrap:anywhere}
.evcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.evhead{width:100%;display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0;flex-wrap:wrap}
.evhead .grow{flex:1 1 220px;min-width:0}
.evhead .grow b{display:block;overflow-wrap:anywhere}
.evhead .grow span{font-size:12.5px;color:var(--muted)}
.evhead:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.prog{display:flex;flex-direction:column;gap:5px;align-items:flex-end;font-size:12px;color:var(--muted)}
.prog .track{width:96px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.slots{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));margin-top:14px}
.slot{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface-2)}
.slot-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot-h b{overflow-wrap:anywhere}
.pp{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;flex-wrap:wrap}
.pp .pn{flex:1 1 100px;min-width:0;overflow-wrap:anywhere}
.pp.vazio{color:var(--muted);font-style:italic;padding:3px 0}
.slot-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;align-items:center}
.evtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;padding:12px;gap:10px}
  .me{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav button{white-space:nowrap}
  .side-foot{flex-direction:row}
  .login{grid-template-columns:minmax(0,1fr);min-height:0}
  .login-brand{padding:24px}
  .login-brand h1{font-size:32px}
  h1{font-size:26px}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="overlay" hidden></div>
<div id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';
var KEY='comunhao-proto-v1';
var TIPOS=['Culto','Santa Ceia','EBD','Ensaio','Reunião','Externo'];
var MINISTERIOS=['Louvor','Infantil','Jovens','Diaconia','Recepção','Mídia','Intercessão','Ensino'];
var CIVIS=['Solteiro(a)','Casado(a)','Divorciado(a)','Viúvo(a)','Criança'];
var CAT_DESP=['Energia elétrica','Água','Internet','Limpeza','Manutenção','Material da EBD','Som e equipamentos','Ajuda social','Ajuda de custo pastoral','Outras'];
var CAT_PAT=['Som e imagem','Instrumentos','Mobiliário','Climatização','Cozinha','Informática'];
var ESTADOS=['Bom','Regular','Ruim','Baixado'];
var FORMAS=['PIX','Dinheiro','Cartão','Transferência','Envelope'];
var STAFF={secretaria:'Helena Duarte',tesouraria:'Wagner Pinheiro',pastor:'Pastor Eliseu Ramos'};
var ROLES={
  fiel:{nome:'Membro',nav:['inicio','meu','agenda','escala','presenca','aniversarios']},
  secretaria:{nome:'Secretaria',nav:['dashboard','membros','funcoes','visitantes','agenda','escala','posicoes','presenca','aniversarios']},
  tesouraria:{nome:'Tesouraria',nav:['financeiro','patrimonio','dashboard','agenda']},
  pastor:{nome:'Pastor e liderança',nav:['dashboard','membros','funcoes','visitantes','agenda','escala','posicoes','presenca','aniversarios','financeiro','patrimonio']}
};
var NAV={inicio:'Início',meu:'Meu cadastro',agenda:'Programação',presenca:'Presença',aniversarios:'Aniversariantes',dashboard:'Painel',membros:'Membros',funcoes:'Funções',escala:'Escala',posicoes:'Posições da escala',visitantes:'Visitantes',financeiro:'Financeiro',patrimonio:'Patrimônio'};

/* ---------- utilidades ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function brl(v){return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function compact(v){return v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(Math.round(v))}
function pad(n){return n<10?'0'+n:''+n}
function toISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function D(iso){return new Date(iso+'T12:00:00')}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12);return x}
function fdate(iso){var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function fshort(iso){var p=iso.split('-');return p[2]+'/'+p[1]}
function wd(iso){return D(iso).toLocaleDateString('pt-BR',{weekday:'long'})}
function nowHM(){var t=new Date();return pad(t.getHours())+':'+pad(t.getMinutes())}
function todayISO(){return toISO(new Date())}
function age(n){var b=D(n),t=new Date(),a=t.getFullYear()-b.getFullYear(),m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;return a}
function ini(n){var p=n.trim().split(/\s+/);return (p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()}
function slug(n){return n.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z ]/g,'').trim().split(/\s+/).join('.')}
function money(v){var n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isNaN(n)?0:Math.round(n*100)/100}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkCode(){var L='ABCDEFGHJKLMNPQRSTUVWXYZ';return 'CG-'+L[Math.floor(Math.random()*24)]+L[Math.floor(Math.random()*24)]+(1000+Math.floor(Math.random()*9000))}
function chip(t,c){return '<span class="chip '+(c||'')+'">'+esc(t)+'</span>'}
function nid(k){S.ids[k]=(S.ids[k]||0)+1;return S.ids[k]}
function monthLabel(key){var p=key.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}

/* ---------- dados de exemplo ---------- */
function seed(){
  var r=rng(11),T=new Date(),cm=T.getMonth()+1,cy=T.getFullYear(),today=toISO(T);

function prune(){

}
function inEvent(e,mid){return !!e.escala&&e.escala.slots.some(function(s){return s.itens.some(function(i){return i.m===mid})})}
function slotOf(e,sid){return e.escala.slots.find(function(x){return x.id===sid})}
function evSlotInfo(e){var tot=0,fill=0;((e.escala&&e.escala.slots)||[]).forEach(function(s){tot+=s.vagas;fill+=Math.min(s.itens.length,s.vagas)});return {tot:tot,fill:fill}}
function abreEm(e){return toISO(addDays(D(e.data),-30))}
function escalaAberta(e){var t=todayISO();return t>=abreEm(e)&&t<=e.data}
function addItem(e,s,mid,origem){
  var m=mem(mid);
  if(!m||m.status!=='Ativo'||!isCoop(m))return 'Somente cooperadores podem entrar na escala.';
  var other=e.escala.slots.find(function(x){return x.itens.some(function(i){return i.m===mid})});
  if(other)return m.nome.split(' ')[0]+' já está escalado(a) neste evento em '+other.nome+'.';
  if(s.itens.length>=s.vagas)return 'Esta posição já está completa.';
  s.itens.push({m:mid,origem:origem});
  s.ausentes=(s.ausentes||[]).filter(function(x){return x!==mid});
  return '';
}
function syncAll(){
  if(!S.posicoes)return;
  var t=todayISO();
  S.events.forEach(function(e){
    if(e.data<t)return;
    var es=e.escala||(e.escala={slots:[],omit:[]});
    if(!es.omit)es.omit=[];
    var wanted=S.posicoes.filter(function(p){return p.tipos.indexOf(e.tipo)>=0&&es.omit.indexOf(p.id)<0});
    es.slots=es.slots.filter(function(sl){return !sl.pid||wanted.some(function(p){return p.id===sl.pid})});
    wanted.forEach(function(p){
      var sl=es.slots.find(function(x){return x.pid===p.id});
      if(!sl){sl={id:nid('sl'),pid:p.id,nome:p.nome,vagas:p.vagas,itens:[],ausentes:[]};es.slots.push(sl)}
      sl.nome=p.nome;sl.vagas=p.vagas;if(!sl.ausentes)sl.ausentes=[];
      sl.itens=sl.itens.filter(function(i){return i.origem!=='fixo'||(p.recorrente&&p.titulares.indexOf(i.m)>=0)});
    });
    wanted.forEach(function(p){
      if(!p.recorrente)return;
      var sl=es.slots.find(function(x){return x.pid===p.id});
      p.titulares.forEach(function(mid){
        if(sl.ausentes.indexOf(mid)>=0||inEvent(e,mid)||sl.itens.length>=sl.vagas)return;
        sl.itens.push({m:mid,origem:'fixo'});
      });
    });
    function ord(x){if(!x.pid)return 9999+x.id;var i=S.posicoes.findIndex(function(p){return p.id===x.pid});return i<0?9998:i}
    es.slots.sort(function(a,b){return ord(a)-ord(b)});
  });
}

  });
}

function agendaList(){

function presencaFiel(){

  '<section class="card"><h3>Tem um código?</h3><form class="inline" data-f="code"><input name="code" placeholder="Ex.: CG-AB1037" aria-label="Código do evento" autocomplete="off" style="text-transform:uppercase"><button class="btn primary" type="submit">Validar presença</button></form></section>'+
  '<section class="card"><h3>Minhas últimas presenças</h3><div class="list">'+(mine.length?mine.map(function(x){return '<div class="row"><div class="grow"><b>'+esc(x.e.titulo)+'</b><span>'+fdate(x.e.data)+' · registrada às '+x.a.h+'</span></div><div class="end">'+chip(x.a.via,'teal')+'</div></div>'}).join(''):'<p class="empty">Você ainda não registrou presença.</p>')+'</div></section>';

function selEvent(){
  var t=new Date(),from=toISO(addDays(t,-7)),to=toISO(addDays(t,7));
  var l=S.events.filter(function(e){return (e.data>=from&&e.data<=to)||e.aberto}).sort(byDT);
  if(!ui.evSel||!ev(ui.evSel)){var op=S.events.filter(function(e){return e.aberto}).sort(byDT)[0];ui.evSel=op?op.id:(l.filter(function(e){return e.data>=toISO(t)})[0]||l[0]||{}).id}
  return l;
}
function presencaGestao(){
  var l=selEvent(),e=ev(ui.evSel);
  var opts=l.map(function(x){return '<option value="'+x.id+'"'+(x.id===ui.evSel?' selected':'')+'>'+fshort(x.data)+' · '+esc(x.titulo)+(x.aberto?' (aberta)':'')+'</option>'}).join('');

    var naoPres=S.members.filter(function(m){return m.status==='Ativo'&&!pres.some(function(p){return p.m.id===m.id})});
    body='<div class="qrwrap"><div>'+(e.aberto?'<div class="qrbox" id="qr" aria-label="QR Code do evento"></div>':'<div class="empty" style="width:190px">QR Code oculto. Abra a presença para exibir.</div>')+'</div>'+
    '<div style="flex:1 1 220px;display:flex;flex-direction:column;gap:8px"><div>'+chip(e.tipo,'teal')+' '+(e.aberto?chip('Presença aberta','ok'):chip('Encerrada'))+'</div><h3 style="margin:0">'+esc(e.titulo)+'</h3><span class="muted">'+wd(e.data)+', '+fdate(e.data)+' · '+e.hora+' · '+esc(e.local)+'</span>'+
    '<div><small class="muted">Código para digitar</small><div class="code">'+esc(e.codigo)+'</div></div>'+
    '<div class="inline"><button class="btn '+(e.aberto?'':'primary')+'" data-a="toggle" data-id="'+e.id+'">'+(e.aberto?'Encerrar presença':'Abrir presença')+'</button></div></div></div>'+
    '<div class="card-head" style="margin-top:20px"><h3>Presentes ('+pres.length+')</h3></div>'+
    '<form class="inline" data-f="manual" style="margin-bottom:8px"><select name="mid" aria-label="Registrar manualmente" style="flex:1 1 200px"><option value="">Registrar manualmente…</option>'+naoPres.map(function(m){return '<option value="'+m.id+'">'+esc(m.nome)+'</option>'}).join('')+'</select><button class="btn" type="submit">Adicionar</button></form>'+
    '<div class="list">'+(pres.length?pres.map(function(x){return '<div class="row">'+ava(x.m,32)+'<div class="grow"><b>'+esc(x.m.nome)+'</b></div><div class="end"><span class="muted num">'+x.a.h+'</span>'+chip(x.a.via,x.a.via==='QR Code'?'teal':'')+'</div></div>'}).join(''):'<p class="empty">Ninguém registrou presença ainda.</p>')+'</div>';
  }
  var hist=S.events.filter(function(x){return x.data<=todayISO()}).sort(function(a,b){return byDT(b,a)}).slice(0,8);
  return head('Presença','Gere o QR Code de cada evento e acompanhe quem está presente.','<button class="btn primary" data-a="newext">QR Code de evento externo</button>')+
  '<section class="card"><div class="toolbar" style="margin-bottom:14px"><select data-s="evSel" aria-label="Evento">'+opts+'</select></div>'+body+'</section>'+
  '<section class="card"><h3>Histórico recente</h3><div class="list">'+hist.map(function(x){var n=S.att.filter(function(a){return a.e===x.id}).length;return '<div class="row click" tabindex="0" role="button" data-a="pickev" data-id="'+x.id+'"><div class="grow"><b>'+esc(x.titulo)+'</b><span>'+fdate(x.data)+' · '+x.hora+'</span></div><div class="end"><b class="num">'+n+'</b><span class="small muted">presentes</span></div></div>'}).join('')+'</div></section>';
}

/* escala */
function minhaEscalaCard(m){
  if(!m)return '';
  var t=todayISO(),coop=m.status==='Ativo'&&isCoop(m),mine=[];
  S.events.forEach(function(e){
    if(e.data<t||!e.escala)return;
    var sl=e.escala.slots.find(function(x){return x.itens.some(function(i){return i.m===m.id})});
    if(sl)mine.push({e:e,s:sl});
  });
  mine.sort(function(a,b){return byDT(a.e,b.e)});
  if(!coop&&!mine.length)return '';
  var abertas=coop?S.events.filter(function(e){if(e.data<t||!e.escala||!escalaAberta(e)||inEvent(e,m.id))return false;var i=evSlotInfo(e);return i.fill<i.tot}).length:0;
  return '<section class="card"><div class="card-head"><h3>Minha escala</h3></div><div class="list">'+
    (mine.length?mine.slice(0,4).map(function(x){var d=D(x.e.data);return '<div class="row"><div class="datebox"><b>'+pad(d.getDate())+'</b><span>'+d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span></div><div class="grow"><b>'+esc(x.s.nome)+'</b><span>'+esc(x.e.titulo)+', '+x.e.hora+'</span></div></div>'}).join(''):'<p class="empty">Você ainda não está em nenhuma escala.</p>')+
    '</div>'+(coop?'<p style="margin-top:10px"><button class="btn primary sm" data-a="nav" data-p="escala">'+(abertas?abertas+' evento(s) com vagas. Quero servir':'Ver escalas')+'</button></p>':'')+'</section>';
}
function slotHtml(e,s,m,lead,coop,ab){
  var n=s.itens.length,full=n>=s.vagas,inEv=m?inEvent(e,m.id):false;
  var people=s.itens.map(function(i){
    var pm=mem(i.m);if(!pm)return '';
    var mine=!!m&&i.m===m.id;
    var canRm=lead||(mine&&i.origem!=='fixo');
    return '<div class="pp">'+ava(pm,26)+'<span class="pn">'+esc(pm.nome)+(mine?' (você)':'')+'</span>'+(i.origem==='fixo'?chip('Fixo','teal'):i.origem==='voluntario'?chip('Voluntário'):'')+
      (canRm?'<button class="btn sm ghost" data-a="rmitem" data-id="'+e.id+'" data-s="'+s.id+'" data-m="'+i.m+'" aria-label="'+(mine?'Sair da escala':'Remover '+esc(pm.nome))+'">'+(mine?'Sair':'Remover')+'</button>':'')+'</div>';
  }).join('');
  var vazios='';for(var k=n;k<Math.min(s.vagas,8);k++)vazios+='<div class="pp vazio">Vaga aberta</div>';
  var act='';
  if(m&&coop&&!inEv&&!full){act+=ab?'<button class="btn primary sm" data-a="volunt" data-id="'+e.id+'" data-s="'+s.id+'">Quero servir</button>':'<span class="small muted">Abre em '+fshort(abreEm(e))+'</span>'}
  if(lead)act+='<button class="btn sm" data-a="assign" data-id="'+e.id+'" data-s="'+s.id+'">'+(full?'Gerenciar':'Escalar')+'</button>';
  return '<div class="slot"><div class="slot-h"><b>'+esc(s.nome)+'</b>'+chip(n+'/'+s.vagas,n>=s.vagas?'ok':n===0?'warn':'')+'</div>'+people+vazios+(act?'<div class="slot-a">'+act+'</div>':'')+'</div>';
}
function escCard(e,m,lead,coop){
  var inf=evSlotInfo(e),ab=escalaAberta(e),open=ui.escOpen===e.id,d=D(e.data);
  var pct=inf.tot?Math.round(inf.fill/inf.tot*100):0;
  var h='<section class="evcard"><div class="evhead" role="button" tabindex="0" data-a="escopen" data-id="'+e.id+'" aria-expanded="'+open+'">'+
    '<div class="datebox"><b>'+pad(d.getDate())+'</b><span>'+d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span></div>'+
    '<div class="grow"><b>'+esc(e.titulo)+'</b><span>'+wd(e.data)+', '+e.hora+' · '+esc(e.local)+'</span></div>'+
    '<div class="chips">'+chip(e.tipo,(e.tipo==='Culto'||e.tipo==='Santa Ceia')?'acc':e.tipo==='EBD'?'teal':e.tipo==='Externo'?'warn':'')+(ab?chip('Escala aberta','ok'):chip('Abre em '+fshort(abreEm(e)),'warn'))+'</div>'+
    '<div class="prog"><span class="num">'+inf.fill+' de '+inf.tot+' vagas</span><div class="track"><i style="width:'+pct+'%"></i></div></div></div>';
  if(open){
    if(!ab)h+='<p class="note" style="margin-top:12px">A escala deste evento abre em '+fdate(abreEm(e))+', 30 dias antes. Até lá, só a liderança pode escalar.</p>';
    h+='<div class="slots">'+e.escala.slots.map(function(s){return slotHtml(e,s,m,lead,coop,ab)}).join('')+'</div>';
    if(!e.escala.slots.length)h+='<p class="empty">Este tipo de evento ainda não tem posições. Cadastre em Posições da escala.</p>';
    if(lead)h+='<div class="evtools"><button class="btn sm" data-a="addslot" data-id="'+e.id+'">Adicionar posição só neste evento</button>'+(e.escala.omit&&e.escala.omit.length?'<button class="btn sm ghost" data-a="restslot" data-id="'+e.id+'">Restaurar posições removidas</button>':'')+'</div>';
  }
  return h+'</section>';
}
function pEscala(){

/* painel */
function hbars(rows){
  var mx=Math.max.apply(null,rows.map(function(r){return r.v}).concat([1]));
  return rows.map(function(r){return '<div class="hb"><span>'+esc(r.l)+'</span><div class="track"><i style="width:'+(r.v/mx*100)+'%"></i></div><em>'+r.v+'</em></div>'}).join('');
}
function months(n){
  var out=[],t=new Date();
  for(var k=0;k<n;k++){var d=new Date(t.getFullYear(),t.getMonth()-k,1,12);out.push({key:d.getFullYear()+'-'+pad(d.getMonth()+1),short:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')})}
  return out;
}
function sumFin(key,tipo){return S.fin.filter(function(f){return f.data.slice(0,7)===key&&(!tipo||f.tipo===tipo)}).reduce(function(s,f){return s+f.valor},0)}
function pDashboard(){

  var faixas=[['Crianças (até 12)',0,12],['Adolescentes (13–17)',13,17],['Jovens (18–29)',18,29],['Adultos (30–59)',30,59],['Idosos (60+)',60,200]].map(function(f){return {l:f[0],v:at.filter(function(m){var a=age(m.nasc);return a>=f[1]&&a<=f[2]}).length}});
  var mins=MINISTERIOS.map(function(x){return {l:x,v:at.filter(function(m){return m.ministerio===x}).length}}).sort(function(a,b){return b.v-a.v});
  var past=S.events.filter(function(e){return e.data<todayISO()}).sort(byDT).slice(-8);
  var counts=past.map(function(e){return S.att.filter(function(a){return a.e===e.id}).length});
  var mxP=Math.max.apply(null,counts.concat([1]));
  var cultos=past.filter(function(e){return e.tipo==='Culto'}),avg=cultos.length?Math.round(cultos.reduce(function(s,e){return s+S.att.filter(function(a){return a.e===e.id}).length},0)/cultos.length):0;
  var vis30=S.visitors.filter(function(v){return v.data>=toISO(addDays(new Date(),-30))}).length;
  var aniv=at.filter(function(m){return +m.nasc.slice(5,7)===new Date().getMonth()+1}).length;
  var mk=months(6),cur=mk[0].key,rec=sumFin(cur,'dizimo')+sumFin(cur,'oferta'),des=sumFin(cur,'despesa');
  var kp='<div class="kpis"><div class="kpi"><small>Membros ativos</small><b>'+at.length+'</b><span>'+S.members.length+' cadastros no total</span></div><div class="kpi"><small>Cooperadores</small><b>'+at.filter(isCoop).length+'</b><span>'+S.funcoes.filter(function(f){return f.cooperador}).length+' funções de cooperador</span></div><div class="kpi"><small>Presença média nos cultos</small><b>'+avg+'</b><span>últimos cultos realizados</span></div><div class="kpi"><small>Visitantes (30 dias)</small><b>'+vis30+'</b><span>'+S.visitors.filter(function(v){return v.retorno}).length+' querem contato</span></div><div class="kpi"><small>Aniversariantes do mês</small><b>'+aniv+'</b><span>'+new Date().toLocaleDateString('pt-BR',{month:'long'})+'</span></div>'+(canFinView()?'<div class="kpi"><small>Saldo do mês</small><b style="color:'+(rec-des>=0?'var(--ok)':'var(--bad)')+'">'+brl(rec-des)+'</b><span>entradas menos despesas</span></div>':'')+'</div>';
  var presChart='<div class="cols">'+past.map(function(e,i){return '<div class="col" title="'+esc(e.titulo)+'"><b>'+counts[i]+'</b><div class="bars"><i style="height:'+(counts[i]/mxP*100)+'%"></i></div><span>'+fshort(e.data)+'<br>'+({Culto:'Culto','Santa Ceia':'Ceia',EBD:'EBD',Ensaio:'Ens.','Reunião':'Reun.',Externo:'Ext.'})[e.tipo]+'</span></div>'}).join('')+'</div>';
  var finChart='';
  if(canFinView()){
    var rows=mk.slice().reverse().map(function(m){return {m:m,r:sumFin(m.key,'dizimo')+sumFin(m.key,'oferta'),d:sumFin(m.key,'despesa')}});
    var mxF=Math.max.apply(null,rows.map(function(x){return Math.max(x.r,x.d)}).concat([1]));
    finChart='<section class="card"><div class="card-head"><h3>Entradas e despesas</h3><div class="legend"><span>Entradas</span><span class="l2">Despesas</span></div></div><div class="cols">'+rows.map(function(x){return '<div class="col"><b>'+compact(x.r)+'</b><div class="bars"><i style="height:'+(x.r/mxF*100)+'%" title="Entradas '+brl(x.r)+'"></i><i class="b2" style="height:'+(x.d/mxF*100)+'%" title="Despesas '+brl(x.d)+'"></i></div><span>'+x.m.short+'</span></div>'}).join('')+'</div></section>';
  }
  var prox=S.events.filter(function(e){return e.data>=todayISO()}).sort(byDT).slice(0,4);
  return head('Painel',userName()+' · visão geral da igreja')+kp+
  '<div class="grid"><section class="card"><h3>Presença nos últimos eventos</h3>'+presChart+'</section>'+finChart+
  '<section class="card"><h3>Membros por faixa etária</h3>'+hbars(faixas)+'</section><section class="card"><h3>Membros por ministério</h3>'+hbars(mins)+'</section>'+'<section class="card"><h3>Membros por função</h3>'+hbars(S.funcoes.map(function(f){return {l:f.nome,v:at.filter(function(m){return (m.funcoes||[]).indexOf(f.id)>=0}).length}}).sort(function(a,b){return b.v-a.v}))+'</section>'+
  '<section class="card"><h3>Próximos eventos</h3><div class="list">'+prox.map(function(e){return evRow(e)}).join('')+'</div></section></div>';
}

  openModal('<h2>'+(id?'Editar posição':'Nova posição')+'</h2><form data-f="posicao" data-id="'+(id||'')+'" style="display:flex;flex-direction:column;gap:16px"><div class="formgrid">'+
    fld('Nome da posição','nome',p.nome,'required placeholder="Ex.: Bateria, Servir a Ceia"')+fld('Vagas por evento','vagas',p.vagas,'type="number" min="1" max="20" required')+'</div>'+
    '<fieldset class="fset"><legend>Existe nestes tipos de evento</legend><div class="checks">'+TIPOS.map(function(t){return '<label class="chk"><input type="checkbox" name="tp" value="'+esc(t)+'"'+(p.tipos.indexOf(t)>=0?' checked':'')+'><span>'+esc(t)+'</span></label>'}).join('')+'</div></fieldset>'+
    '<label class="chk"><input type="checkbox" name="rec"'+(p.recorrente?' checked':'')+'><span><b>Posição recorrente</b><br><span class="muted small">Os titulares abaixo entram sozinhos na escala de todos os próximos eventos desses tipos.</span></span></label>'+
    '<fieldset class="fset"><legend>Titulares (só vale se for recorrente)</legend>'+(coops.length?'<div class="checks">'+coops.map(function(x){return '<label class="chk"><input type="checkbox" name="ti" value="'+x.id+'"'+(p.titulares.indexOf(x.id)>=0?' checked':'')+'><span>'+esc(x.nome)+'</span></label>'}).join('')+'</div>':'<p class="muted small">Nenhum cooperador ativo. Vincule funções de cooperador aos membros primeiro.</p>')+'</fieldset>'+
    (id?'<div id="delbox" class="note" hidden><p>Excluir remove esta posição da escala dos próximos eventos. Eventos passados não mudam.</p><div class="modal-actions" style="margin-top:8px"><button class="btn sm" type="button" data-a="delpos" data-id="'+id+'">Confirmar exclusão</button></div></div>':'')+
    actions('Salvar',del)+'</form>');
}
function modalVis(){
  openModal('<h2>Novo visitante</h2><form data-f="visitante" style="display:flex;flex-direction:column;gap:16px"><div class="formgrid">'+fld('Nome','nome','','required')+fld('Telefone / WhatsApp','tel','','inputmode="tel"')+fld('Data da visita','data',todayISO(),'type="date" required')+sel('Participou de','evento',['Culto','EBD','Ensaio','Reunião','Evento externo'],'Culto')+'<div class="f wide"><span>Como conheceu a igreja</span><input name="origem" placeholder="Convite de um membro, passou em frente, redes sociais..."></div><label class="f wide" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="retorno" checked style="width:auto"><span>Quer receber contato da igreja</span></label></div>'+actions('Salvar visitante')+'</form>');
}
function modalEv(id){
  var e=id?ev(id):{titulo:'',tipo:'Culto',data:todayISO(),hora:'19:30',local:'Templo principal'};
  openModal('<h2>'+(id?'Editar evento':'Novo evento')+'</h2><form data-f="evento" data-id="'+(id||'')+'" style="display:flex;flex-direction:column;gap:16px"><div class="formgrid">'+fld('Título','titulo',e.titulo,'required')+sel('Tipo','tipo',TIPOS,e.tipo)+fld('Data','data',e.data,'type="date" required')+fld('Horário','hora',e.hora,'type="time" required')+'<div class="f wide"><span>Local</span><input name="local" value="'+esc(e.local)+'"></div></div>'+actions('Salvar')+'</form>');
}
function modalExt(){
  openModal('<h2>QR Code de evento externo</h2><p class="muted small">Use quando o evento acontece fora da igreja. O QR Code aparece na tela do seu aparelho e os fiéis o validam no celular deles.</p><form data-f="ext" style="display:flex;flex-direction:column;gap:16px"><div class="formgrid">'+fld('Nome do evento','titulo','','required placeholder="Ex.: Evangelismo na praça"')+fld('Local','local','','required')+fld('Data','data',todayISO(),'type="date" required')+fld('Horário','hora',nowHM(),'type="time" required')+'</div>'+actions('Gerar QR Code')+'</form>');
}
function modalFin(){
  var diz=S.members.filter(function(m){return m.status==='Ativo'});
  openModal('<h2>Novo lançamento</h2><form data-f="fin" style="display:flex;flex-direction:column;gap:16px"><div class="formgrid">'+
  '<label class="f"><span>Tipo</span><select name="tipo" id="finTipoSel" data-s="finForm"><option value="dizimo">Dízimo</option><option value="oferta">Oferta</option><option value="despesa">Despesa</option></select></label>'+
  fld('Valor (R$)','valor','','required inputmode="decimal" placeholder="0,00"')+fld('Data','data',todayISO(),'type="date" required')+sel('Forma','forma',FORMAS,'PIX')+
  '<label class="f wide" data-show="dizimo"><span>Dizimista</span><select name="m">'+diz.map(function(m){return '<option value="'+m.id+'">'+esc(m.nome)+'</option>'}).join('')+'</select></label>'+
  '<label class="f wide" data-show="oferta despesa" hidden><span>Descrição</span><input name="desc" placeholder="Ex.: Oferta de missões, conta de energia"></label>'+
  '<label class="f wide" data-show="despesa" hidden><span>Categoria da despesa</span><select name="cat">'+CAT_DESP.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></label></div>'+actions('Lançar')+'</form>');
}
function modalItem(id){
  var i=id?S.inv.find(function(x){return x.id===id}):{item:'',cat:CAT_PAT[0],local:'',qtd:1,valor:'',estado:'Bom',aquisicao:todayISO(),obs:''};
  openModal('<h2>'+(id?'Editar item':'Novo item')+'</h2><form data-f="item" data-id="'+(id||'')+'" style="display:flex;flex-direction:column;gap:16px"><div class="formgrid"><div class="f wide"><span>Descrição do bem</span><input name="item" value="'+esc(i.item)+'" required></div>'+sel('Categoria','cat',CAT_PAT,i.cat)+fld('Local','local',i.local,'required')+fld('Quantidade','qtd',i.qtd,'type="number" min="1" required')+fld('Valor unitário (R$)','valor',i.valor===''?'':String(i.valor).replace('.',','),'required inputmode="decimal"')+sel('Estado','estado',ESTADOS,i.estado)+fld('Data de aquisição','aquisicao',i.aquisicao,'type="date"')+'<div class="f wide"><span>Observações</span><textarea name="obs">'+esc(i.obs)+'</textarea></div></div>'+actions('Salvar')+'</form>');
}
function modalScan(id){
  var e=ev(id);ui.scanId=id;
  openModal('<h2>Ler QR Code</h2><div class="vf" aria-hidden="true"><div class="ln"></div></div><p><b>'+esc(e.titulo)+'</b><br><span class="muted">'+fshort(e.data)+' · '+e.hora+' · '+esc(e.local)+'</span></p><p class="note">No sistema real, a câmera do celular lê o QR Code. Neste protótipo a leitura é simulada pelo botão abaixo.</p><div class="modal-actions"><button class="btn" data-a="close">Cancelar</button><button class="btn primary" data-a="scanok">Simular leitura do QR Code</button></div>');
}

/* ---------- ações ---------- */
function checkin(eid,mid,via){
  var e=ev(eid);if(!e||!e.aberto){toast('A presença deste evento está encerrada.','bad');return false}
  if(S.att.some(function(a){return a.e===eid&&a.m===mid})){toast('Sua presença já foi registrada.');return false}
  S.att.push({e:eid,m:mid,h:nowHM(),via:via});save();return true;
}
function render(){
  $('#root').innerHTML=ui.user?shell():loginView();
  var nv=document.querySelector('.nav'),nc=nv&&nv.querySelector('[aria-current]');
  if(nv&&nc&&nv.scrollWidth>nv.clientWidth)nv.scrollLeft=nc.offsetLeft-(nv.clientWidth-nc.offsetWidth)/2;
  var q=$('#qr');
  if(q&&ui.evSel){
    var e=ev(ui.evSel),txt='comunhao://presenca/'+e.codigo;
    try{new QRCode(q,{text:txt,width:200,height:200,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(err){q.style.lineHeight='1.4';q.textContent=txt}
  }
}
function refreshList(){var f=LISTS[ui.page];var l=$('#list');if(f&&l)l.innerHTML=f()}
function go(p){ui.page=p;render();window.scrollTo(0,0)}

document.addEventListener('click',function(ev_){
  var el=ev_.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,id=+el.dataset.id;
  if(a==='stop')return;
  if(a==='approve'){ev_.stopPropagation();mem(id).status='Ativo';save();toast('Cadastro aprovado.');render();return}
  switch(a){
    case 'login':
      var r=el.dataset.role;ui.user={role:r,mid:r==='fiel'?+$('#loginMember').value:null};ui.page='';ui.evSel=null;render();break;
    case 'logout':ui.user=null;render();break;
    case 'reset':S=seed();migrate();save();ui.evSel=null;toast('Dados de exemplo restaurados.');render();break;
    case 'register':modalRegister();break;
    case 'nav':go(el.dataset.p);break;
    case 'close':closeModal();break;
    case 'ftipo':ui.fTipo=el.dataset.v;render();break;
    case 'ftipofin':ui.finTipo=el.dataset.v;render();break;
    case 'newmem':modalMem();break;
    case 'editmem':if(canMembers())modalMem(id);break;
    case 'newvis':modalVis();break;
    case 'escopen':ui.escOpen=ui.escOpen===id?0:id;render();break;
    case 'etipo':ui.eTipo=el.dataset.v;render();break;
    case 'volunt':
      var eV=ev(id),sV=slotOf(eV,+el.dataset.s);
      if(!ui.user.mid){break}
      if(!escalaAberta(eV)){toast('A escala deste evento abre em '+fdate(abreEm(eV))+'.','bad');break}
      var errV=addItem(eV,sV,ui.user.mid,'voluntario');
      if(errV)toast(errV,'bad');else{save();toast('Você está na escala. Obrigado por servir!');render()}
      break;
    case 'rmitem':
      var eR=ev(id),sR=slotOf(eR,+el.dataset.s),mR=+el.dataset.m,itR=sR.itens.find(function(i){return i.m===mR});
      if(!itR)break;
      if(!canMembers()&&(mR!==ui.user.mid||itR.origem==='fixo'))break;
      sR.itens=sR.itens.filter(function(i){return i.m!==mR});
      if(itR.origem==='fixo'&&sR.ausentes.indexOf(mR)<0)sR.ausentes.push(mR);
      save();toast(mR===ui.user.mid?'Você saiu da escala.':'Removido da escala.');render();break;
    case 'assign':if(canMembers())modalAssign(id,+el.dataset.s);break;
    case 'rmslot':
      if(!canMembers())break;
      var eS=ev(id),sS=slotOf(eS,+el.dataset.s);
      if(sS.pid&&eS.escala.omit.indexOf(sS.pid)<0)eS.escala.omit.push(sS.pid);
      eS.escala.slots=eS.escala.slots.filter(function(x){return x.id!==sS.id});
      save();closeModal();toast('Posição removida deste evento.');render();break;
    case 'addslot':if(canMembers())modalAddSlot(id);break;
    case 'restslot':if(canMembers()){ev(id).escala.omit=[];save();toast('Posições restauradas.');render()}break;
    case 'newpos':modalPos();break;
    case 'editpos':modalPos(id);break;
    case 'delpos':
      S.posicoes=S.posicoes.filter(function(x){return x.id!==id});
      save();closeModal();toast('Posição excluída.');render();break;
    case 'newfunc':modalFunc();break;
    case 'editfunc':modalFunc(id);break;
    case 'delask':var db=$('#delbox');if(db)db.hidden=false;break;
    case 'delfunc':
      S.funcoes=S.funcoes.filter(function(x){return x.id!==id});
      S.members.forEach(function(m){m.funcoes=(m.funcoes||[]).filter(function(x){return x!==id})});
      if(String(ui.fFuncao)===String(id))ui.fFuncao='';
      save();closeModal();toast('Função excluída.');render();break;
    case 'tomember':
      var v=S.visitors.find(function(x){return x.id===id});
      S.members.push({id:nid('m'),nome:v.nome,nasc:'',tel:v.tel,email:'',endereco:'',civil:'Solteiro(a)',batismo:'',ministerio:'',status:'Pendente',foto:null,funcoes:[]});
      S.visitors=S.visitors.filter(function(x){return x.id!==id});save();toast('Visitante enviado para a lista de membros (pendente).');render();break;
    case 'newev':modalEv();break;
    case 'editev':if(canEvents())modalEv(id);break;
    case 'newext':modalExt();break;
    case 'toggle':var e1=ev(id);e1.aberto=!e1.aberto;save();toast(e1.aberto?'Presença aberta. O QR Code está na tela.':'Presença encerrada.');render();break;
    case 'pickev':ui.evSel=id;render();window.scrollTo(0,0);break;
    case 'newfin':modalFin();break;
    case 'newitem':modalItem();break;
    case 'edititem':if(canFinEdit())modalItem(id);break;
    case 'scan':modalScan(id);break;
    case 'scanok':
      if(checkin(ui.scanId,ui.user.mid,'QR Code')){closeModal();toast('Presença registrada. Que bom ter você aqui!');render()}else closeModal();
      break;
  }
});
$('#modal').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.row.click,.evhead')&&e.target.dataset.a){e.preventDefault();e.target.click()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.q){ui[t.dataset.q]=t.value;refreshList()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.photo){
    var f=t.files&&t.files[0];if(!f)return;
    readPhoto(f,function(url){ui.tmpFoto=url;$('#fotoPrev').innerHTML='<img class="ava" style="width:72px;height:72px" src="'+url+'" alt="Nova foto">'});return;
  }
  if(t.dataset&&t.dataset.s){
    var k=t.dataset.s;
    if(k==='finForm'){var v=t.value;document.querySelectorAll('[data-show]').forEach(function(x){x.hidden=x.dataset.show.split(' ').indexOf(v)<0});return}
    ui[k]=(k==='annMonth'||k==='evSel')?+t.value:t.value;render();
  }
});
function readPhoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();img.onload=function(){var s=256,c=document.createElement('canvas'),k=Math.min(img.width,img.height);c.width=c.height=s;c.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,s,s);cb(c.toDataURL('image/jpeg',.82))};img.onerror=function(){toast('Não foi possível ler essa imagem.','bad')};img.src=fr.result};
  fr.readAsDataURL(file);
}
function readMember(fd,base){
  var m=base||{id:nid('m'),foto:null,status:'Ativo'};
  ['nome','nasc','tel','email','endereco','civil','batismo','ministerio'].forEach(function(k){if(fd.has(k))m[k]=String(fd.get(k)).trim()});
  if(fd.has('status'))m.status=fd.get('status');
  if(ui.tmpFoto!==undefined)m.foto=ui.tmpFoto;
  if(fd.has('hasfn'))m.funcoes=fd.getAll('fn').map(Number);
  if(!m.funcoes)m.funcoes=[];
  return m;
}
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
  var fd=new FormData(f),kind=f.dataset.f,id=+f.dataset.id||0;
  switch(kind){
    case 'meu':readMember(fd,me());save();toast('Cadastro atualizado.');render();break;
    case 'register':
      var nm=readMember(fd,null);nm.status='Pendente';S.members.push(nm);save();closeModal();
      ui.user={role:'fiel',mid:nm.id};ui.page='inicio';toast('Cadastro enviado. A secretaria vai confirmar.');render();break;
    case 'membro':
      var cur=id?mem(id):null,m2=readMember(fd,cur);if(!cur)S.members.push(m2);save();closeModal();toast('Membro salvo.');render();break;
    case 'assign':
      var eA=ev(id),sA=slotOf(eA,+f.dataset.s),midA=+fd.get('mid');
      if(!midA)return;
      var errA=addItem(eA,sA,midA,'lider');
      if(errA){toast(errA,'bad');return}
      save();closeModal();toast('Cooperador escalado.');render();break;
    case 'addslot':
      var eN=ev(id),nmN=String(fd.get('nome')).trim();
      eN.escala.slots.push({id:nid('sl'),pid:null,nome:nmN,vagas:Math.max(1,Math.min(20,parseInt(fd.get('vagas'),10)||1)),itens:[],ausentes:[],custom:true});
      save();closeModal();toast('Posição adicionada ao evento.');render();break;
    case 'posicao':
      var nmP=String(fd.get('nome')).trim(),tps=fd.getAll('tp');
      if(!tps.length){toast('Marque ao menos um tipo de evento.','bad');return}
      if(S.posicoes.some(function(x){return x.id!==id&&x.nome.toLowerCase()===nmP.toLowerCase()})){toast('Já existe uma posição com esse nome.','bad');return}
      var px=id?S.posicoes.find(function(x){return x.id===id}):{id:nid('pos')};
      px.nome=nmP;px.tipos=tps;px.vagas=Math.max(1,Math.min(20,parseInt(fd.get('vagas'),10)||1));
      px.recorrente=fd.get('rec')==='on';
      px.titulares=px.recorrente?fd.getAll('ti').map(Number):[];
      if(!id)S.posicoes.push(px);
      save();closeModal();toast('Posição salva.');render();break;
    case 'funcao':
      var nomeF=String(fd.get('nome')).trim();
      if(S.funcoes.some(function(x){return x.id!==id&&x.nome.toLowerCase()===nomeF.toLowerCase()})){toast('Já existe uma função com esse nome.','bad');return}
      var fx=id?fnc(id):{id:nid('fn')};
      fx.nome=nomeF;fx.descricao=String(fd.get('descricao')||'').trim();fx.cooperador=fd.get('coop')==='on';
      if(!id)S.funcoes.push(fx);
      var want=fd.getAll('mv').map(Number);
      S.members.forEach(function(m){
        if(!m.funcoes)m.funcoes=[];
        var has=m.funcoes.indexOf(fx.id)>=0,wt=want.indexOf(m.id)>=0;
        if(wt&&!has)m.funcoes.push(fx.id);
        if(!wt&&has)m.funcoes=m.funcoes.filter(function(x){return x!==fx.id});
      });
      save();closeModal();toast('Função salva.');render();break;
    case 'visitante':
      S.visitors.push({id:nid('v'),nome:fd.get('nome').trim(),tel:fd.get('tel'),data:fd.get('data'),origem:fd.get('origem'),evento:fd.get('evento'),retorno:fd.get('retorno')==='on',obs:''});
      save();closeModal();toast('Visitante registrado.');render();break;
    case 'evento':
      var t=fd.get('tipo'),ex=id?ev(id):null;
      var o=ex||{id:nid('e'),aberto:false,codigo:mkCode()};
      o.titulo=fd.get('titulo').trim();o.tipo=t;o.data=fd.get('data');o.hora=fd.get('hora');o.local=fd.get('local')||'Templo principal';o.externo=t==='Externo';
      if(!ex)S.events.push(o);save();closeModal();toast('Evento salvo.');render();break;
    case 'ext':
      var ne={id:nid('e'),titulo:fd.get('titulo').trim(),tipo:'Externo',data:fd.get('data'),hora:fd.get('hora'),local:fd.get('local').trim(),externo:true,aberto:true,codigo:mkCode()};
      S.events.push(ne);ui.evSel=ne.id;save();closeModal();toast('QR Code gerado. Mostre a tela aos participantes.');render();break;
    case 'manual':
      var mid=+fd.get('mid');if(!mid)return;
      S.att.push({e:ui.evSel,m:mid,h:nowHM(),via:'Manual'});save();toast('Presença registrada.');render();break;
    case 'code':
      var c=String(fd.get('code')).trim().toUpperCase(),eC=S.events.find(function(x){return x.codigo===c});
      if(!eC){toast('Código não encontrado. Confira e tente de novo.','bad');return}
      if(checkin(eC.id,ui.user.mid,'Código')){toast('Presença registrada em '+eC.titulo+'.');render()}break;
    case 'fin':
      var tp=fd.get('tipo'),val=money(fd.get('valor'));
      if(!(val>0)){toast('Informe um valor maior que zero.','bad');return}
      S.fin.push({id:nid('f'),data:fd.get('data'),tipo:tp,valor:val,desc:tp==='dizimo'?'Dízimo':(fd.get('desc')||(tp==='oferta'?'Oferta':'Despesa')),m:tp==='dizimo'?+fd.get('m'):null,forma:fd.get('forma'),cat:tp==='despesa'?fd.get('cat'):''});
      ui.finMonth=fd.get('data').slice(0,7);save();closeModal();toast('Lançamento salvo.');render();break;
    case 'item':
      var it=id?S.inv.find(function(x){return x.id===id}):{id:nid('i')};
      if(!id){it.codigo='PAT-'+('000'+S.ids.i).slice(-4);S.inv.push(it)}
      it.item=fd.get('item').trim();it.cat=fd.get('cat');it.local=fd.get('local').trim();it.qtd=Math.max(1,parseInt(fd.get('qtd'),10)||1);it.valor=money(fd.get('valor'));it.estado=fd.get('estado');it.aquisicao=fd.get('aquisicao');it.obs=fd.get('obs');
      save();closeModal();toast('Item salvo.');render();break;
  }
});
render();
})();
</script>
